schema: spec-driven

context: |
  Purpose: a website that tells users which completed sports games are worth watching "as live"
  (entertaining games rather than one-sided blowouts) without spoiling the score or events of the game.
  Spoiler-free is a hard rule: no UI, API response, URL, page title or error message may reveal scores,
  results or key events of a game the user hasn't chosen to reveal.
  Hosting must stay within Azure free/low-cost tiers (Azure SQL free offer, API container scales to zero),
  so designs should tolerate cold starts and avoid always-on resources.
  Every change needs tests: xUnit for the API, Vitest for src/web.
  Never commit, push or open a PR without asking first.

